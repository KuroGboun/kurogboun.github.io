<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win Your Morning — your friends are the alarm clock</title>
<meta name="description" content="Your friends are the alarm clock. Make your promises the night before, prove it with a photo by the deadline, or wake up as Bum of the Day.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#4C86C6">

<meta property="og:type" content="website">
<meta property="og:title" content="Win Your Morning">
<meta property="og:description" content="Your friends are the alarm clock. Make your promises the night before, prove it with a photo by the deadline, or wake up as Bum of the Day.">
<meta property="og:url" content="https://kurogboun.github.io/win-your-morning/">
<meta property="og:image" content="https://kurogboun.github.io/win-your-morning/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Win Your Morning">
<meta name="twitter:description" content="Your friends are the alarm clock. Prove your morning by the deadline — or wake up as Bum of the Day.">
<meta name="twitter:image" content="https://kurogboun.github.io/win-your-morning/assets/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,300;10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  :root{
    --paper:#FFFFFF; --ink:#1E2A24; --forest:#2E4A3B; --forest-d:#22382E;
    --terra:#C4562F; --terra-soft:#DB7A54; --gold:#E0A032; --amber:#F2B84B;
    --cream:#F4ECD8; --plum:#3A2E4A;
    --cta:#E0A032; --cta-text:#1E2A24; --cta-hover:#F2B84B;
    /* Primary = the display face (the "Win your morning" wordmark + buttons);
       secondary = system text for everything else. */
    --font-primary:'Bricolage Grotesque',sans-serif;
    --font-secondary:-apple-system,'SF Pro Text',system-ui,sans-serif;
  }
  html,body{margin:0; height:100%}
  /* Desktop = one screen, no scroll (the hero IS the viewport). Phones scroll —
     see the max-width:640 query — so nothing gets cut off on short screens. */
  body{font-family:var(--font-secondary); background:#4C86C6; color:var(--ink);
       -webkit-font-smoothing:antialiased; overflow:hidden}
  a{text-decoration:none}

  /* Full-bleed: the sky runs edge to edge (no max-width here), so a wide screen
     never shows the body colour as side bands. */
  .page{width:100%; margin:0 auto; overflow:hidden; background:var(--paper)}

  /* ── Hero ─────────────────────────────────────────────────────────── */
  .hero{position:relative; height:100svh; overflow:hidden; display:flex; flex-direction:column;
        background:linear-gradient(178deg,#6FA3DA 0%,#4C86C6 34%,#8DB8E4 72%,#CFE0F1 100%);}
  /* The layout stays composed in a centred 1440 frame; only the sky bleeds full
     width. Floaters/nav/content anchor to THIS, so they never fly to the edges
     of an ultra-wide monitor. */
  .frame{position:relative; z-index:1; width:100%; max-width:1440px; margin:0 auto;
         flex:1; display:flex; flex-direction:column}
  .cloud{position:absolute; border-radius:50%; pointer-events:none}
  .c1{left:-60px; top:120px; width:460px; height:240px; background:rgba(255,255,255,.42); filter:blur(38px)}
  .c2{right:-80px; top:300px; width:560px; height:300px; background:rgba(255,255,255,.36); filter:blur(46px)}
  .c3{left:18%; bottom:40px; width:62%; height:320px; background:rgba(255,255,255,.5); filter:blur(56px)}

  /* The emoji live in a band. On desktop it fills the frame and they scatter to
     the right of the copy; the phone media query turns it into a flow strip
     between the caption and the form. Decorative only — not interactive. */
  .floatband{position:absolute; inset:0; z-index:2; pointer-events:none}
  .float{position:absolute; width:var(--s); height:var(--s);
         filter:drop-shadow(0 16px 22px rgba(20,40,70,.26))}
  .float img{width:100%; height:100%; object-fit:contain; display:block;
             pointer-events:none; -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none}
  /* Desktop scatter positions — off inline styles so the phone query can win. */
  #f1{--s:92px;  left:55.6%; top:12.4%}  #f2{--s:114px; left:74.8%; top:10.5%}
  #f3{--s:88px;  left:90.9%; top:22.6%}  #f4{--s:106px; left:61.4%; top:28.1%}
  #f5{--s:124px; left:79.2%; top:29.1%}  #f6{--s:94px;  left:53.9%; top:45.3%}
  #f7{--s:84px;  left:69.3%; top:50.1%}  #f8{--s:100px; left:88.7%; top:48.4%}
  #f10{--s:118px; left:56.6%; top:64.5%} #f13{--s:102px; left:79.4%; top:65.1%}
  @keyframes bobA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(-2deg)}}
  @keyframes bobB{0%,100%{transform:translateY(0) rotate(7deg)}50%{transform:translateY(-24px) rotate(2deg)}}
  @keyframes bobC{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(4deg)}}
  .bobA{animation:bobA 8s ease-in-out infinite}
  .bobB{animation:bobB 8.4s ease-in-out infinite}
  .bobC{animation:bobC 7.6s ease-in-out infinite}

  /* ── Nav ──────────────────────────────────────────────────────────── */
  .nav{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:26px 44px}
  .brand{display:flex; align-items:center; gap:8px; color:var(--cream)}
  .brand span{font-family:var(--font-primary); font-size:13px; font-weight:800; letter-spacing:-.01em; line-height:.9}
  .nav-cta{display:inline-flex; align-items:center; font-family:var(--font-primary); font-size:15px; font-weight:700;
           color:var(--cta-text); background:var(--cta); padding:13px 24px; border-radius:999px;
           transition:background .16s ease, transform .16s ease}
  .nav-cta:hover{background:var(--cta-hover); transform:translateY(-1px)}
  .nav-cta:active{transform:translateY(0)}

  /* ── Hero content ─────────────────────────────────────────────────── */
  .content{position:relative; z-index:3; padding:66px 72px 0; max-width:820px}
  /* The form block — its own element (not inside .content) so the phone band
     can slot between the caption and it. On desktop it sits under the copy.
     Flex column so the counter can order:-1 up above the form (social proof
     right under the caption); phone puts it back under the button. */
  .signup{position:relative; z-index:3; max-width:560px; padding:0 72px 40px;
          display:flex; flex-direction:column}
  .kicker{display:inline-block; transform:rotate(-4deg); background:var(--terra); color:var(--cream);
          font-size:11px; font-weight:800; letter-spacing:.14em; padding:7px 12px; border-radius:8px}
  h1{margin:26px 0 0; font-family:var(--font-primary); font-size:clamp(52px,13vw,150px); font-weight:800;
     line-height:.8; letter-spacing:-.05em; color:var(--cream)}
  .squiggle{display:block; margin-top:12px; width:min(420px,64%); height:auto}
  /* Heavier + a soft shadow so the caption stays legible over the cloud blobs. */
  .caption{font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
           font-size:clamp(17px,2vw,26px); line-height:1.4; font-weight:600; color:#F7F1DF;
           text-shadow:0 1px 14px rgba(20,40,70,.45), 0 1px 3px rgba(20,40,70,.3);
           margin-top:28px; max-width:560px}

  form{display:flex; align-items:center; gap:10px; margin-top:36px; max-width:560px}
  .email{flex:1; min-width:0; font-family:var(--font-secondary);
         font-size:17px; color:var(--ink); background:var(--cream);
         border:1px solid rgba(30,42,36,.14); border-radius:16px; padding:18px 20px; outline:none}
  /* Once joined we drop the input entirely and show the email as plain text on
     the sky — no box, and the full address always shows (wraps if long). */
  .signed{flex:1; min-width:0; display:none; padding:2px 0;
          font-family:var(--font-secondary); font-size:17px; font-weight:700; color:var(--cream);
          line-height:1.35; overflow-wrap:anywhere; word-break:break-word;
          text-shadow:0 1px 12px rgba(20,40,70,.45)}
  .signed.show{display:block}
  .signed .tick{color:#8FE6B0; font-weight:800; margin-right:7px}
  .join{font-family:var(--font-primary); font-size:19px; font-weight:700; letter-spacing:-.01em;
        color:var(--cta-text); background:var(--cta); border:0; border-radius:16px; padding:19px 30px;
        cursor:pointer; white-space:nowrap; transition:background .16s ease, color .16s ease, transform .16s ease}
  .join:hover:not(:disabled){background:var(--cta-hover); transform:translateY(-1px)}
  .join:active:not(:disabled){transform:translateY(0)}
  .join:disabled{cursor:default; opacity:.9}
  /* Joined: forest ground + cream text so the ☀️ actually reads (it disappeared
     into the gold). Full opacity even though the button is now disabled. */
  .join.done{background:var(--forest); color:var(--cream); opacity:1}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0; overflow:hidden}
  .msg{min-height:16px; font-family:-apple-system,system-ui,sans-serif; font-size:14px;
       color:var(--cream); margin-top:12px; max-width:560px}
  .counter{order:-1; font-family:var(--font-secondary); font-size:13px; font-weight:600; letter-spacing:.01em;
           color:rgba(244,236,216,.9); text-shadow:0 1px 10px rgba(20,40,70,.35); margin:20px 0 0}

  /* ── Tablet ───────────────────────────────────────────────────────── */
  @media (max-width:1024px){
    .float{width:calc(var(--s)*.66); height:calc(var(--s)*.66)}
    .content{padding:60px 48px 40px}
    #f7{display:none}
  }

  /* ── Short laptops: shrink so it still fits one screen (no scroll) ──── */
  @media (min-width:641px) and (max-height:820px){
    .content{padding-top:40px; padding-bottom:24px}
    h1{font-size:clamp(44px,8vw,104px)}
    .caption{margin-top:18px; font-size:clamp(16px,1.6vw,21px)}
    form{margin-top:24px}
  }

  /* ── Phone (board: mobile) — a clean vertical stack: nav → copy → emoji
        band → form. The page SCROLLS here so nothing gets cut off. ── */
  @media (max-width:640px){
    html,body{height:auto; overflow-x:hidden; overflow-y:auto}
    .hero{height:auto; min-height:100svh}
    .nav{padding:18px 24px}
    .nav-cta{font-size:13px; padding:11px 18px}
    .content{padding:30px 24px 0; max-width:none}
    h1{font-size:clamp(50px,16.5vw,66px); line-height:.84; letter-spacing:-.04em}
    .caption{margin-top:18px; font-size:17px; line-height:1.45}

    /* Band becomes a flow strip between caption and form; the 8 emoji the board
       uses sit at its own coordinates (left %, top px within the strip). */
    .floatband{position:relative; inset:auto; height:212px; margin-top:6px}
    .float{filter:drop-shadow(0 12px 18px rgba(20,40,70,.24))}
    #f7,#f13{display:none}
    #f1 {left:5%;  top:26px;  width:70px; height:70px}
    #f3 {left:28%; top:2px;   width:62px; height:62px}
    #f2 {left:47%; top:24px;  width:82px; height:82px}
    #f8 {left:75%; top:0;     width:66px; height:66px}
    #f4 {left:76%; top:96px;  width:72px; height:72px}
    #f6 {left:2%;  top:120px; width:64px; height:64px}
    #f5 {left:24%; top:108px; width:86px; height:86px}
    #f10{left:53%; top:126px; width:72px; height:72px}

    .signup{max-width:none; padding:0 24px 22px}
    form{flex-direction:column; align-items:stretch; gap:10px; margin-top:0}
    .email,.signed,.join{width:100%; text-align:center}
    .join{padding:18px 24px}
    .counter{order:0; text-align:center; margin-top:10px}
  }
</style>
</head>
<body>

<div class="page">
  <section class="hero">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="frame">
    <!-- Nav -->
    <div class="nav">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="navSun" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#F2B84B"></stop><stop offset="1" stop-color="#C4562F"></stop></radialGradient></defs><circle cx="60" cy="60" r="44" fill="url(#navSun)"></circle></svg>
        <span>WIN<br>YOUR<br>MORNING</span>
      </div>
      <a href="#get" class="nav-cta">Join the waitlist</a>
    </div>

    <!-- Content -->
    <div class="content">
      <span class="kicker">RISE OR BE ROASTED</span>
      <h1>Win your<br>morning</h1>
      <svg class="squiggle" width="420" height="24" viewBox="0 0 420 24" fill="none" stroke="#E0A032" stroke-width="7" stroke-linecap="round" aria-hidden="true"><path d="M6 15 Q 42 5 78 13 T 150 13 T 222 13 T 294 13 T 366 12 T 414 11"></path></svg>
      <p class="caption">Your friends are the alarm clock. Make your promises the night before, prove it with a photo by the deadline, or wake up as Bum of the Day.</p>
    </div>

    <!-- Emoji — a scattered cluster on desktop, a neat band between the caption
         and the form on phones (board: mobile). Decorative only. -->
    <div class="floatband">
      <div class="float bobA" id="f1"  data-float="obj1"><img src="assets/emoji-obj1.png"  alt=""></div>
      <div class="float bobC" id="f2"  data-float="obj2"><img src="assets/emoji-obj2.png"  alt=""></div>
      <div class="float bobB" id="f3"  data-float="obj3"><img src="assets/emoji-obj3.png"  alt=""></div>
      <div class="float bobB" id="f4"  data-float="obj4"><img src="assets/emoji-obj4.png"  alt=""></div>
      <div class="float bobA" id="f5"  data-float="obj5"><img src="assets/emoji-obj5.png"  alt=""></div>
      <div class="float bobC" id="f6"  data-float="obj6"><img src="assets/emoji-obj6.png"  alt=""></div>
      <div class="float bobC" id="f7"  data-float="obj7"><img src="assets/emoji-obj7.png"  alt=""></div>
      <div class="float bobA" id="f8"  data-float="obj8"><img src="assets/emoji-obj8.png"  alt=""></div>
      <div class="float bobB" id="f10" data-float="obj10"><img src="assets/emoji-obj10.png" alt=""></div>
      <div class="float bobC" id="f13" data-float="obj13"><img src="assets/emoji-obj13.png" alt=""></div>
    </div>

    <div class="signup">
      <form id="get" novalidate>
        <input class="email" id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" aria-label="Your email" />
        <input class="hp" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="signed" id="signedEmail"></div>
        <button class="join" id="joinBtn" type="submit">Join the waitlist</button>
      </form>
      <div class="msg" id="formMsg" role="status" aria-live="polite"></div>
      <div class="counter" id="counter">68 people ready to win their mornings</div>
    </div>
    </div>
  </section>
</div>

<script>
/* ── Waitlist ─────────────────────────────────────────────────────────── */
(function () {
  var API = 'https://bdwaqpnycvywhhuzhlga.supabase.co/functions/v1/waitlist';
  var KEY = 'wym.lp.joined';
  var form = document.getElementById('get');
  var input = document.getElementById('email');
  var btn = document.getElementById('joinBtn');
  var hp = document.getElementById('website');
  var counter = document.getElementById('counter');
  var signed = document.getElementById('signedEmail');
  var msg = document.getElementById('formMsg');

  function counterText(n) { return n + ' people ready to win their mornings'; }

  function renderJoined(email, n) {
    // Drop the text box entirely; show just the email they signed up with.
    input.style.display = 'none';
    if (email) {
      signed.innerHTML = '<span class="tick">✓</span>';
      signed.appendChild(document.createTextNode(email));
      signed.classList.add('show');
    }
    // The button turns forest so the ☀️ actually reads (it vanished on gold).
    btn.textContent = "YOU'RE IN ☀️";
    btn.classList.add('done');
    btn.disabled = true;
    if (n) counter.textContent = counterText(n); // incremented — you're counted now
    msg.textContent = '';
  }

  // Returning visitor who already joined on this device — restore email + count.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  var alreadyJoined = !!(saved && saved.email);
  if (alreadyJoined) renderJoined(saved.email, saved.n);

  // Live count — silently leaves the static "68" fallback if it fails.
  if (!alreadyJoined) {
    fetch(API).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && typeof d.count === 'number') counter.textContent = counterText(d.count);
    }).catch(function () {});
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (btn.disabled) return;
    var email = (input.value || '').trim();
    if (!email) { input.focus(); return; }
    var restore = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'JOINING…';
    msg.textContent = '';
    var src = new URLSearchParams(location.search).get('src');
    fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: email, source: src, website: hp.value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && d.joined) {
        try { localStorage.setItem(KEY, JSON.stringify({ email: email, n: d.count })); } catch (e2) {}
        renderJoined(email, d.count);
      } else {
        btn.disabled = false;
        btn.textContent = restore;
        msg.textContent = d && d.error === 'invalid_email' ? 'That email looks off — mind checking it?'
          : d && d.error === 'rate_limited' ? 'Whoa, slow down a sec.'
          : 'Hmm, try again in a moment.';
      }
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = restore;
      msg.textContent = 'Network hiccup — try again.';
    });
  });
})();
</script>
</body>
</html>
